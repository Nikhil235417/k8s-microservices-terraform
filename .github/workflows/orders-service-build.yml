name: Build an Push Orders-Service to ECR

on:
  push:
    branches:
      - master
      - feature/**
    paths:
      - 'apps/orders-service/**'
      - '.github/workflows/orders-service.build.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dev-orders-service
  SERVICE_NAME: orders-service

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG apps/$SERVICE_NAME/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Output Image URI
        run: |
          echo "Docker image pushed to ECR: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Update Helm values.yaml with new image tag
        run: |
          cd helm/microservices
          sed -i 's/tag: .*/tag: ${{ github.sha }}/g' values.yaml

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected. Proceeding with the commit."
            git add values.yaml
            git commit -m "chore(orders-service): update image tag to ${{ github.sha }}"
            git push origin HEAD:feature/develop
          else
            echo "No Changes for do the Commmit. The values.yaml file already contains this tag, or the 'sed' command did not find any matches."
          fi
    